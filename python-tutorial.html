    <!-- Global Error Interceptor for Diagnostics -->
    <script>
        window.addEventListener('error', function(e) {
            console.error("Diagnostic Error Captured:", e);
            setTimeout(() => {
                const el = document.getElementById('loaderText');
                if (el) {
                    el.innerHTML = `<span style="color: #ef4444; font-weight:700; font-family: monospace; display: block; text-align: left; font-size: 0.8rem; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px; border: 1px solid rgba(239,68,68,0.2);">🔴 Load Error: ${e.message}<br>Line: ${e.lineno}<br>Source: ${e.filename ? e.filename.split('/').pop() : 'unknown'}</span>`;
                }
            }, 100);
        });
        window.addEventListener('unhandledrejection', function(e) {
            console.error("Diagnostic Rejection Captured:", e);
            setTimeout(() => {
                const el = document.getElementById('loaderText');
                if (el) {
                    el.innerHTML = `<span style="color: #ef4444; font-weight:700; font-family: monospace; display: block; text-align: left; font-size: 0.8rem; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px; border: 1px solid rgba(239,68,68,0.2);">🔴 Rejection: ${e.reason}</span>`;
                }
            }, 100);
        });
    </script>

    <!-- Pyodide CDN for WebAssembly Python -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

    <style>
        :root {
            --py-blue: #3776ab;
            --py-yellow: #ffd343;
            --term-bg: #030712;
            --term-green: #10b981;
            --err-bg: rgba(239, 68, 68, 0.1);
            --err-border: #ef4444;
            --err-text: #fca5a5;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* NAVIGATION OVERRIDE */
        .navbar {
            position: relative;
            height: 70px;
            padding: 0;
            display: flex;
            align-items: center;
            background: rgba(2, 6, 23, 0.95);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        /* TUTORIAL WORKSPACE CONTAINER */
        .tutorial-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: calc(100vh - 70px);
            overflow: hidden;
            position: relative;
        }

        /* SIDEBAR LIST OF LESSONS */
        .sidebar {
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: white;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-wrapper {
            margin-top: 10px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 6px;
            position: relative;
            overflow: hidden;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-bar {
            background: linear-gradient(to right, var(--py-blue), var(--py-yellow));
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .lesson-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lesson-item {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lesson-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .lesson-item.active {
            background: rgba(59, 130, 246, 0.12);
            border-left: 4px solid var(--primary);
        }

        .lesson-status-icon {
            font-size: 0.95rem;
            color: var(--text-dim);
        }

        .lesson-item.completed .lesson-status-icon {
            color: #10b981;
        }

        .lesson-title-text {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 210px;
        }

        .lesson-item.active .lesson-title-text {
            color: white;
            font-weight: 600;
        }

        .lesson-item.completed .lesson-title-text {
            color: #e2e8f0;
        }

        /* MAIN CONTENT PANES (GRID SPLIT) */
        .workspace {
            display: grid;
            grid-template-columns: 45% 55%;
            height: 100%;
            overflow: hidden;
            background: rgba(2, 6, 23, 0.3);
        }

        /* LEFT PANE: THEORY */
        .theory-pane {
            padding: 30px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(10px);
        }

        .theory-header-section {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .theory-difficulty {
            display: inline-block;
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .theory-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
        }

        .theory-body {
            color: #cbd5e1;
            font-size: 0.92rem;
            line-height: 1.65;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .theory-body code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .theory-body ul, .theory-body ol {
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .theory-body h4 {
            color: white;
            font-size: 1.05rem;
            margin-top: 15px;
            border-left: 3px solid var(--primary);
            padding-left: 10px;
        }

        .code-snippet-box {
            background: #060913;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: #e2e8f0;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: pre-wrap;
        }

        .code-snippet-box:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .code-snippet-box::after {
            content: '💻 Click to load into workspace';
            position: absolute;
            bottom: 6px;
            right: 12px;
            font-size: 0.68rem;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .code-snippet-box:hover::after {
            opacity: 1;
            color: var(--accent);
        }

        .success-banner {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: 12px;
            padding: 18px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* RIGHT PANE: EDITOR & TERMINAL */
        .editor-console-pane {
            display: grid;
            grid-template-rows: 60% 40%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            position: relative;
        }

        /* EDITOR */
        .editor-container {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }

        .editor-header {
            background: #090d16;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            height: 45px;
        }

        .editor-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
        }

        .editor-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .editor-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-dim);
        }

        .editor-btn.run-btn {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .editor-btn.run-btn:hover {
            background: #2563eb;
            transform: scale(1.03);
        }

        .editor-body {
            flex: 1;
            display: flex;
            background: #070b13;
            position: relative;
            overflow: hidden;
        }

        .line-numbers {
            width: 42px;
            background: #04070d;
            border-right: 1px solid var(--border);
            padding: 15px 0;
            text-align: right;
            padding-right: 10px;
            color: rgba(148, 163, 184, 0.4);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            user-select: none;
            overflow-y: hidden;
        }

        #codeEditor {
            flex: 1;
            background: transparent;
            color: #cbd5e1;
            border: none;
            outline: none;
            padding: 15px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.82rem;
            line-height: 1.6;
            resize: none;
            overflow-y: auto;
            white-space: pre;
            overflow-x: auto;
            tab-size: 4;
            caret-color: var(--accent);
        }

        /* CONSOLE/TERMINAL */
        .console-container {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--term-bg);
        }

        .console-header {
            background: #090d16;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            height: 38px;
        }

        .console-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--term-green);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .console-line {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .console-error {
            color: #f87171;
        }

        .console-system {
            color: #38bdf8;
        }

        .console-success {
            color: #34d399;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.08);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #10b981;
            margin-top: 5px;
        }

        .terminal-clear {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .terminal-clear:hover {
            color: white;
        }

        /* AI EXPLAINER CARD */
        .ai-explainer {
            background: rgba(217, 119, 6, 0.06);
            border: 1px solid rgba(217, 119, 6, 0.3);
            border-radius: 10px;
            padding: 16px 20px;
            margin-top: 10px;
            display: none;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.08);
        }

        .ai-header {
            color: #fbbf24;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ai-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #f59e0b;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 3px;
            font-weight: 700;
        }

        .ai-content {
            font-size: 0.82rem;
            color: #fef3c7;
            line-height: 1.6;
        }

        .ai-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            color: #fbbf24;
            font-size: 0.78rem;
        }

        /* PYODIDE LOADER OVERLAY */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020617;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 500;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        .loader-text {
            margin-top: 18px;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            max-width: 250px;
        }

        /* MOBILE HEADER TAB NAVIGATION */
        .mobile-tabs {
            display: none;
            background: #090d16;
            border-bottom: 1px solid var(--border);
            height: 45px;
        }

        .mobile-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 100%;
            transition: all 0.2s;
        }

        .mobile-tab-btn.active {
            color: white;
            border-bottom: 2px solid var(--primary);
            background: rgba(255, 255, 255, 0.02);
        }

        /* SCROLLBAR STYLING */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* RESPONSIVE LAYOUTS */
        @media (max-width: 900px) {
            .tutorial-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none; /* Hide sidebar list on mobile, or toggle later */
            }
            .workspace {
                grid-template-columns: 1fr;
            }
            .mobile-tabs {
                display: flex;
            }
            .theory-pane, .editor-console-pane {
                display: none;
                height: 100%;
            }
            .theory-pane.active, .editor-console-pane.active {
                display: flex;
            }
            .editor-console-pane.active {
                display: grid;
            }
        }
    </style>
</head>

        lineNumbers.scrollTop = codeEditor.scrollTop;
    }

    function handleEditorInput() {
        updateLineNumbers();
        syncScroll();
    }

    function updateLineNumbers() {
        const lines = codeEditor.value.split('\n');
        let numHTML = '';
        for (let i = 1; i <= lines.length; i++) {
            numHTML += i + '<br>';
        }
        lineNumbers.innerHTML = numHTML;
    }

    // Toggle Mobile Tabs
    function switchMobileTab(tab) {
        const learnBtn = document.getElementById('tabBtnLearn');
        const practiceBtn = document.getElementById('tabBtnPractice');
        const theoryPane = document.getElementById('theoryPane');
        const workspacePane = document.getElementById('workspacePane');

        if (tab === 'learn') {
            learnBtn.classList.add('active');
            practiceBtn.classList.remove('active');
            theoryPane.classList.add('active');
            workspacePane.classList.remove('active');
        } else {
            learnBtn.classList.remove('active');
            practiceBtn.classList.add('active');
            theoryPane.classList.remove('active');
            workspacePane.classList.add('active');
        }
    }

    // Load Lessons List Sidebar
    function buildLessonList() {
        const list = document.getElementById('lessonList');
        list.innerHTML = "";
        lessons.forEach((lesson, index) => {
            const li = document.createElement('li');
            li.id = `lesson-item-${lesson.id}`;
            li.className = 'lesson-item';
            if (index === currentLessonIndex) li.classList.add('active');
            
            const isCompleted = completedLessons.includes(lesson.id);
            if (isCompleted) li.classList.add('completed');

            const iconClass = isCompleted ? 'fas fa-check-circle' : 'far fa-circle';
            
            li.innerHTML = `
                <i class="lesson-status-icon ${iconClass}"></i>
                <div class="lesson-title-text">${lesson.title}</div>
            `;
            
            li.onclick = () => {
                selectLesson(index);
                // On mobile, auto slide tab to Learn details
                if (window.innerWidth <= 900) {
                    switchMobileTab('learn');
                }
            };
            list.appendChild(li);
        });
        updateProgress();
    }

    // Select specific lesson
    function selectLesson(index) {
        // Remove active class
        const currentActive = document.querySelector('.lesson-item.active');
        if (currentActive) currentActive.classList.remove('active');

        currentLessonIndex = index;
        const lesson = lessons[index];

        // Apply active class to new lesson item
        const newItem = document.getElementById(`lesson-item-${lesson.id}`);
        if (newItem) newItem.classList.add('active');

        // Load Lesson Details
        document.getElementById('theoryDifficulty').textContent = lesson.difficulty;

        // Color difficulties
        const diffSpan = document.getElementById('theoryDifficulty');
        if (lesson.difficulty === 'Beginner') {
            diffSpan.style.background = 'rgba(34, 197, 94, 0.2)';
            diffSpan.style.color = '#4ade80';
        } else if (lesson.difficulty === 'Intermediate') {
            diffSpan.style.background = 'rgba(245, 158, 11, 0.2)';
            diffSpan.style.color = '#fbbf24';
        } else {
            diffSpan.style.background = 'rgba(239, 68, 68, 0.2)';
            diffSpan.style.color = '#f87171';
        }

        document.getElementById('theoryTitle').textContent = lesson.title;
        document.getElementById('theoryBody').innerHTML = lesson.theory;
        
        // Hide success banner
        document.getElementById('successBanner').style.display = 'none';

        // Load Default Code
        const savedCode = localStorage.getItem(`python_code_lesson_${lesson.id}`);
        codeEditor.value = savedCode ? savedCode : lesson.defaultCode;
        
        updateLineNumbers();
        
        // Clear workspace outputs
        const oldCard = document.getElementById('aiExplainerCard');
        if (oldCard) oldCard.remove();
    }

    // Copy theory code snippets directly to Workspace code editor
    function copySnippetToEditor(code) {
        codeEditor.value = code;
        updateLineNumbers();
        // Glow effect feedback
        codeEditor.style.boxShadow = "inset 0 0 10px rgba(0, 242, 255, 0.3)";
        setTimeout(() => {
            codeEditor.style.boxShadow = "none";
        }, 500);
        
        // Switch view to Practice if on mobile
        if (window.innerWidth <= 900) {
            switchMobileTab('practice');
        }
    }

    // Reset default template code
    function resetDefaultCode() {
        if (confirm("Are you sure you want to reset this lesson's editor workspace to its template default?")) {
            const lesson = lessons[currentLessonIndex];
            codeEditor.value = lesson.defaultCode;
            localStorage.removeItem(`python_code_lesson_${lesson.id}`);
            updateLineNumbers();
            clearConsole();
        }
    }

    // Save code to local storage as user types
    codeEditor.addEventListener('input', () => {
        const lesson = lessons[currentLessonIndex];
        localStorage.setItem(`python_code_lesson_${lesson.id}`, codeEditor.value);
    });

    // Handle Tab key insertion inside custom textarea editor
    codeEditor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = codeEditor.selectionStart;
            const end = codeEditor.selectionEnd;
            // set textarea value to: text before caret + tab + text after caret
            codeEditor.value = codeEditor.value.substring(0, start) + "    " + codeEditor.value.substring(end);
            // put caret in correct position
            codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
            updateLineNumbers();
        }
    });

    // Update Progress
    function updateProgress() {
        const total = lessons.length;
        const completed = completedLessons.length;
        const percentage = Math.round((completed / total) * 100);
        document.getElementById('progressBar').style.width = percentage + "%";
        document.getElementById('progressText').innerHTML = `<span>Progress</span><span>${percentage}% Complete</span>`;
    }

    // Mark completed lesson
    function markLessonComplete(id) {
        if (!completedLessons.includes(id)) {
            completedLessons.push(id);
            localStorage.setItem('completed_python_lessons', JSON.stringify(completedLessons));
            buildLessonList();
        }
        document.getElementById('successBanner').style.display = 'flex';
        
        // Dynamic console logging feedback
        appendConsoleLine("----------------------------------------------", "system");
        appendConsoleLine("[SYSTEM] CHALLENGE CRITERIA MET SUCCESSFULLY!", "success");
        appendConsoleLine("----------------------------------------------", "system");
    }

    // Next Lesson
    function loadNextLesson() {
        if (currentLessonIndex < lessons.length - 1) {
            selectLesson(currentLessonIndex + 1);
            document.getElementById('successBanner').style.display = 'none';
        } else {
            alert("🌟 Excellent work, Defender! You have fully completed all 12 modules in the Python Pathway. Deploy your skills in the Linux Lab!");
        }
    }

    // Console Streams
    let terminalOutputBuffer = "";

    function appendConsoleLine(text, type = "") {
        const consoleEl = document.getElementById('consoleOutput');
        const span = document.createElement('span');
        span.className = 'console-line';
        if (type) span.classList.add('console-' + type);
        span.textContent = text;
        consoleEl.appendChild(span);
        consoleEl.scrollTop = consoleEl.scrollHeight;

        terminalOutputBuffer += text + "\n";
    }

    function clearConsole() {
        document.getElementById('consoleOutput').innerHTML = "";
        terminalOutputBuffer = "";
        const oldCard = document.getElementById('aiExplainerCard');
        if (oldCard) oldCard.remove();
    }

    // PYODIDE EXECUTION ENGINE
    let pyodide = null;
    let isPyodideLoading = true;

    async function initPyodideEngine() {
        const loader = document.getElementById('pyodideLoader');
        try {
            pyodide = await loadPyodide({
                indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.1/full/",
                stdout: (text) => {
                    appendConsoleLine(text);
                },
                stderr: (text) => {
                    appendConsoleLine(text, 'error');
                }
            });

            // Set up input dialog mock
            await pyodide.runPythonAsync(`
import builtins
import js

def custom_input(prompt=""):
    val = js.prompt(prompt)
    if val is None:
        return ""
    print(prompt + val)
    return val

builtins.input = custom_input
            `);

            isPyodideLoading = false;
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 300);

            // Print success init
            document.getElementById('consoleOutput').innerHTML = "";
            appendConsoleLine("Python 3 environment sandbox initiated. System secure.", "system");
            appendConsoleLine("Click 'Run Code' to execute your script.", "system");
        } catch (err) {
            console.error(err);
            document.getElementById('loaderText').innerHTML = `<span style="color: #ef4444; font-weight:700;">Initialization Failed</span><br><span style="font-size:0.75rem; color:var(--text-dim);">Unable to load WASM engine. Check connection.</span>`;
        }
    }

    // RUN BUTTON TRIGGER
    async function runPythonCode() {
        if (isPyodideLoading) return;

        const runBtn = document.querySelector('.run-btn');
        const userCode = codeEditor.value;

        runBtn.disabled = true;
        runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';

        clearConsole();
        appendConsoleLine("Executing script inside browser WASM sandbox...", "system");

        try {
            // Run User Script
            await pyodide.runPythonAsync(userCode);

            // Execute challenge test verification
            const lesson = lessons[currentLessonIndex];
            let challengePassed = false;

            if (lesson.validatorType === 'output') {
                challengePassed = terminalOutputBuffer.includes(lesson.expectedOutput);
            } else if (lesson.validatorType === 'python') {
                try {
                    const pyCheck = await pyodide.runPythonAsync(lesson.validatorScript);
                    challengePassed = (pyCheck === true || pyCheck === 1);
                } catch (e) {
                    challengePassed = false;
                }
            }

            if (challengePassed) {
                markLessonComplete(lesson.id);
            } else {
                appendConsoleLine("\n[SYSTEM] Run complete. Output does not match challenge targets. Review theory instructions.", "system");
            }

        } catch (err) {
            const errorMsg = err.message;
            appendConsoleLine(errorMsg, "error");
            
            // Analyze Traceback Error and Trigger AI explainer
            const explanation = analyzePythonError(errorMsg);
            displayAIExplanation(explanation);
        } finally {
            runBtn.disabled = false;
            runBtn.innerHTML = '<i class="fas fa-play"></i> Run Code';
        }
    }

    // ERROR EXPLAINER ENGINE
    function analyzePythonError(message) {
        let type = "Unknown Interpreter Issue";
        let desc = "We encountered a runtime or compile error executing your Python scripts.";
        let fix = "Examine the console log traceback above for details on line numbers.";

        if (message.includes("SyntaxError")) {
            type = "Syntax Error";
            if (message.includes("expected ':'") || message.includes("expected ':'")) {
                desc = "You missed a colon (<code>:</code>) at the end of a header line (such as an <code>if</code>, <code>elif</code>, <code>else</code>, <code>for</code>, <code>while</code>, or <code>def</code> statement).";
                fix = "Check the line specified and append a colon (<code>:</code>) to the end. For example:<br><code>if score >= 80:</code> instead of <code>if score >= 80</code>";
            } else if (message.includes("was never closed") || message.includes("unmatched")) {
                desc = "You opened brackets or parentheses (e.g. <code>(</code>, <code>[</code>, <code>{</code>) or quotes but forgot to close them with a matching symbol.";
                fix = "Find the line number and verify every opening parenthetical or quotation sign has its matching closing symbol.";
            } else if (message.includes("invalid syntax")) {
                desc = "The interpreter doesn't understand the structure of your line. This usually points to misspelled keywords or symbols out of order.";
                fix = "Look for typing errors or misplaced commas/quotes on that line.";
            } else {
                desc = "Your statement violates structural formatting rules of Python.";
                fix = "Double-check coding syntax spelling and symbol pairings.";
            }
        } 
        else if (message.includes("NameError")) {
            type = "Name Error";
            let match = message.match(/name '([^']+)' is not defined/);
            let name = match ? match[1] : "variable/function";
            desc = `You called an identifier name <code>${name}</code> which does not exist, hasn't been defined yet, or is misspelled.`;
            fix = `Ensure <code>${name}</code> is typed exactly correct. Variables must be defined (e.g. <code>${name} = 10</code>) <em>before</em> they are used in lower lines of your script.`;
        } 
        else if (message.includes("IndentationError")) {
            type = "Indentation Error";
            desc = "Python requires structured alignment spaces to know which blocks of code belong inside controls (like loops or conditionals). Your indentation spacing is uneven.";
            fix = "Format all lines belonging inside that block with the exact same space indentation (typically 4 spaces or 1 tab). Do not mix tabs and spaces.";
        } 
        else if (message.includes("TypeError")) {
            type = "Type Error";
            desc = "You attempted to perform an action combining data types that do not support each other (e.g. adding a text string to an integer: <code>'Age: ' + 25</code>).";
            fix = "Use type casting to unify data types. Wrap variables to convert them: <code>str(25)</code> to text, or <code>int('123')</code> to integer.";
        } 
        else if (message.includes("ZeroDivisionError")) {
            type = "Zero Division Error";
            desc = "You calculated a mathematical formula trying to divide a value by 0. Mathematically, division by zero is impossible.";
            fix = "Check your variables or calculations to prevent denominators evaluating to zero, or write an if check beforehand: <code>if divisor != 0:</code>";
        } 
        else if (message.includes("IndexError")) {
            type = "Index Error";
            desc = "You tried to fetch a index position from a list that is outside its boundaries (e.g. asking for list item 5 in a list with only 3 elements).";
            fix = "Remember that indexing begins at <code>0</code>, and the max index is <code>len(list) - 1</code>. Ensure index targets fall inside these bounds.";
        } 
        else if (message.includes("KeyError")) {
            type = "Key Error";
            let match = message.match(/'([^']+)'/);
            let key = match ? match[1] : "key";
            desc = `You attempted to look up dictionary records using a key name <code>${key}</code> which does not exist.`;
            fix = `Verify spelling of the dictionary key, or use the safer <code>.get()</code> dictionary function to fetch records without crashing (e.g., <code>hacker.get('${key}', 'Offline')</code>).`;
        } 
        else if (message.includes("ValueError")) {
            type = "Value Error";
            desc = "A conversion function received data of correct structure but invalid content (such as converting literal characters <code>int('hacker')</code> to integers).";
            fix = "Ensure the contents of variables passed into conversions represent numbers (like <code>int('85')</code>).";
        } 
        else if (message.includes("AttributeError")) {
            type = "Attribute Error";
            desc = "You tried to execute a function method on an object variable which doesn't support that attribute (like calling <code>.append()</code> on a string variable).";
            fix = "Verify the object variable type. Lists support <code>.append()</code>, while strings use functions like <code>.upper()</code> or <code>.replace()</code>.";
        }

        return { type, desc, fix };
    }

    function displayAIExplanation(errObj) {
        const consoleEl = document.getElementById('consoleOutput');
        
        // Remove existing if any
        const oldCard = document.getElementById('aiExplainerCard');
        if (oldCard) oldCard.remove();

        const card = document.createElement('div');
        card.id = 'aiExplainerCard';
        card.className = 'ai-explainer';
        card.style.display = 'block';
        card.innerHTML = `
            <div class="ai-header">
                <i class="fas fa-robot"></i> AI Code Explainer
            </div>
            <div class="ai-content">
                <div class="ai-section-title">Detected Issue</div>
                <div style="font-weight: 600; color: #fbbf24; margin-bottom: 5px;">${errObj.type}</div>
                <div>${errObj.desc}</div>
                
                <div class="ai-section-title" style="margin-top: 10px;">Suggested Solution</div>
                <div>${errObj.fix}</div>
            </div>
        `;
        
        // Append card into terminal output so it naturally flows in the reader's view!
        consoleEl.appendChild(card);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // RUN INITIALIZERS ON DOM LOAD
    window.addEventListener('DOMContentLoaded', () => {
        buildLessonList();
        selectLesson(0);
        initPyodideEngine();
    });
</script>

</body>
</html>
